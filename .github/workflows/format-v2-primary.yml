name: Temporary V2 Primary Formatter

on:
  push:
    branches:
      - release/game-v2-primary

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/game-v2-primary
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - run: npm ci
      - run: npx prettier --write apps/web/server.mjs apps/web/src/main.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/server.mjs apps/web/src/main.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format Game V2 primary route changes"
            git push
          fi
