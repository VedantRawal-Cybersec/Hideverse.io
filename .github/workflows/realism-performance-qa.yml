name: Temporary Realism Performance QA

on:
  push:
    branches:
      - visual/real-materials-pass

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        case:
          - name: nexus-desktop
            map: nexus
            mobile: "false"
          - name: hospital-desktop
            map: hospital
            mobile: "false"
          - name: ravenwood-mobile
            map: ravenwood
            mobile: "true"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2

      - run: npm install --no-audit --no-fund
      - run: npm run build:live
      - run: npm install --no-save --no-audit --no-fund playwright@1.55.0
      - run: npx playwright install --with-deps chromium

      - name: Start production server
        run: |
          PORT=43994 npm run start --workspace @hideverse/web > /tmp/hideverse-realism.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:43994/api/multiplayer/health >/dev/null; then
              exit 0
            fi
            sleep 0.2
          done
          cat /tmp/hideverse-realism.log
          exit 1

      - name: Verify real materials and frame pacing
        env:
          MAP_ID: ${{ matrix.case.map }}
          MOBILE: ${{ matrix.case.mobile }}
          CASE_NAME: ${{ matrix.case.name }}
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext(
            process.env.MOBILE === 'true'
              ? {
                  viewport: { width: 390, height: 844 },
                  hasTouch: true,
                  isMobile: true,
                  deviceScaleFactor: 2,
                }
              : { viewport: { width: 1440, height: 900 } },
          );
          const page = await context.newPage();
          const errors = [];
          const textureResponses = [];
          page.on('pageerror', (error) => errors.push(String(error)));
          page.on('response', (response) => {
            if (response.url().includes('/materials/cc0/')) {
              textureResponses.push({
                url: response.url(),
                status: response.status(),
              });
            }
          });

          try {
            await page.goto(
              `http://127.0.0.1:43994/game/?map=${process.env.MAP_ID}&room=REALISM-QA`,
              { waitUntil: 'domcontentloaded', timeout: 60000 },
            );
            await page.waitForSelector('#boot-overlay.is-hidden', { timeout: 60000 });
            await page.waitForTimeout(4200);

            const stats = await page.evaluate(async () => {
              const samples = [];
              let last = performance.now();
              const deadline = last + 5000;
              await new Promise((resolve) => {
                const tick = (now) => {
                  samples.push(now - last);
                  last = now;
                  if (now >= deadline) resolve();
                  else requestAnimationFrame(tick);
                };
                requestAnimationFrame(tick);
              });

              samples.sort((a, b) => a - b);
              const averageMs = samples.reduce((sum, value) => sum + value, 0) / samples.length;
              const at = (p) => samples[Math.min(samples.length - 1, Math.floor(samples.length * p))];
              return {
                samples: samples.length,
                averageFps: 1000 / averageMs,
                p95Ms: at(0.95),
                longFrames: samples.filter((value) => value > 33.4).length,
                fpsHud: document.querySelector('#fps-value')?.textContent ?? '',
                quality: document.querySelector('#quality-select')?.value ?? '',
              };
            });

            const successfulTextures = textureResponses.filter((entry) => entry.status === 200);
            console.log(
              '[realism-performance-qa]',
              JSON.stringify({
                case: process.env.CASE_NAME,
                stats,
                textures: successfulTextures,
                errors,
              }),
            );

            if (errors.length) throw new Error(errors.join(' | '));
            if (successfulTextures.length < 3) {
              throw new Error(
                `Expected at least 3 real surface textures, got ${successfulTextures.length}`,
              );
            }
          } finally {
            await context.close();
            await browser.close();
          }
          NODE
