name: Vendor Real Surface Textures

on:
  push:
    branches:
      - feature/real-materials-wave1

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/real-materials-wave1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download pinned CC0 surface textures
        run: |
          set -euo pipefail
          COMMIT="fcc4ff97a5a843dc2e242ec9e195389bc46ed7d2"
          BASE="https://raw.githubusercontent.com/Papyszoo/CC0-Public-Domain-Textures/$COMMIT/packs/ambientcg-textures/textures"
          DEST="assets/runtime/materials/reference"
          mkdir -p "$DEST"

          curl -L --fail --retry 3 "$BASE/Concrete034/Concrete034_1K-PNG_Color_preview.png" -o "$DEST/concrete.png"
          curl -L --fail --retry 3 "$BASE/Bricks004/Bricks004_1K-PNG_Color_preview.png" -o "$DEST/brick.png"
          curl -L --fail --retry 3 "$BASE/Asphalt007/Asphalt007_1K-PNG_Color_preview.png" -o "$DEST/asphalt.png"
          curl -L --fail --retry 3 "$BASE/Metal004/Metal004_1K-PNG_Color_preview.png" -o "$DEST/metal.png"
          curl -L --fail --retry 3 "$BASE/WoodSiding004/WoodSiding004_1K-PNG_Color_preview.png" -o "$DEST/wood.png"
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/Papyszoo/CC0-Public-Domain-Textures/$COMMIT/LICENSE" -o "$DEST/LICENSE"

          cat > "$DEST/SOURCE.md" <<EOF
          # Surface texture provenance

          Upstream: https://github.com/Papyszoo/CC0-Public-Domain-Textures
          Pinned commit: $COMMIT
          License: CC0-1.0

          Runtime textures:
          - concrete.png — AmbientCG Concrete034 color preview
          - brick.png — AmbientCG Bricks004 color preview
          - asphalt.png — AmbientCG Asphalt007 color preview
          - metal.png — AmbientCG Metal004 color preview
          - wood.png — AmbientCG WoodSiding004 color preview

          These are lightweight preview-resolution CC0 textures chosen specifically to improve
          surface realism while preserving browser/mobile performance.
          EOF

          ls -lh "$DEST"

      - name: Commit textures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/runtime/materials/reference/
          if ! git diff --cached --quiet; then
            git commit -m "Vendor lightweight CC0 surface textures"
            git push
          fi
