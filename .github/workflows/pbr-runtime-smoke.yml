name: Temporary PBR Runtime Smoke

on:
  push:
    branches:
      - graphics/real-materials-priority

permissions:
  contents: read

jobs:
  pbr-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        case:
          - name: low-desktop
            mobile: "false"
            quality: low
            expect_full_pbr: "false"
          - name: balanced-desktop
            mobile: "false"
            quality: balanced
            expect_full_pbr: "true"
          - name: auto-mobile
            mobile: "true"
            quality: auto
            expect_full_pbr: "false"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2

      - run: npm install --no-audit --no-fund
      - run: npm run build:live
      - run: npm install --no-save --no-audit --no-fund playwright@1.55.0
      - run: npx playwright install --with-deps chromium

      - name: Start production server
        run: |
          PORT=43994 npm run start --workspace @hideverse/web > /tmp/pbr-server.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:43994/api/multiplayer/health >/dev/null; then
              exit 0
            fi
            sleep 0.2
          done
          cat /tmp/pbr-server.log
          exit 1

      - name: Verify real surface streaming
        env:
          MOBILE: ${{ matrix.case.mobile }}
          QUALITY: ${{ matrix.case.quality }}
          EXPECT_FULL_PBR: ${{ matrix.case.expect_full_pbr }}
          CASE_NAME: ${{ matrix.case.name }}
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext(
            process.env.MOBILE === 'true'
              ? {
                  viewport: { width: 390, height: 844 },
                  hasTouch: true,
                  isMobile: true,
                  deviceScaleFactor: 2,
                }
              : { viewport: { width: 1440, height: 900 } },
          );

          await context.addInitScript((quality) => {
            localStorage.setItem('hideverse-quality', quality);
          }, process.env.QUALITY);

          const page = await context.newPage();
          const errors = [];
          const warnings = [];
          const failed = [];
          const pbrResponses = [];

          page.on('console', (message) => {
            if (message.type() === 'warning' || message.type() === 'error') {
              warnings.push(message.text());
            }
          });

          page.on('pageerror', (error) => errors.push(String(error)));
          page.on('requestfailed', (request) => {
            failed.push({
              url: request.url(),
              error: request.failure()?.errorText ?? 'unknown',
            });
          });
          page.on('response', (response) => {
            if (response.url().includes('/materials/pbr/')) {
              pbrResponses.push({
                url: response.url(),
                status: response.status(),
              });
            }
          });

          try {
            await page.goto(
              'http://127.0.0.1:43994/game/?map=nexus&room=PBR-QA',
              { waitUntil: 'domcontentloaded', timeout: 60000 },
            );
            await page.waitForSelector('#boot-overlay.is-hidden', { timeout: 60000 });
            await page.waitForTimeout(18000);

            const color = pbrResponses.filter((entry) => entry.url.includes('-color.ktx2'));
            const normal = pbrResponses.filter((entry) => entry.url.includes('-normal.ktx2'));
            const roughness = pbrResponses.filter((entry) => entry.url.includes('-roughness.ktx2'));

            if (errors.length) throw new Error(`page errors: ${errors.join(' | ')}`);
            if (failed.length) throw new Error(`failed requests: ${JSON.stringify(failed)}`);
            if (color.length < 4 || color.some((entry) => entry.status !== 200)) {
              throw new Error(`compressed color textures missing: ${JSON.stringify(pbrResponses)}`);
            }

            const expectFull = process.env.EXPECT_FULL_PBR === 'true';
            if (expectFull) {
              if (normal.length < 4 || roughness.length < 4) {
                throw new Error(`full PBR maps not streamed: ${JSON.stringify(pbrResponses)}`);
              }
            } else if (normal.length !== 0 || roughness.length !== 0) {
              throw new Error(
                `lightweight profile loaded expensive PBR maps: ${JSON.stringify(pbrResponses)}`,
              );
            }

            const state = await page.evaluate(() => ({
              fps: document.querySelector('#fps-value')?.textContent ?? '',
              quality: document.querySelector('#quality-select')?.value ?? '',
              status: document.querySelector('#map-status')?.textContent ?? '',
            }));

            console.log(
              '[pbr-smoke] PASS',
              JSON.stringify({
                case: process.env.CASE_NAME,
                state,
                warnings,
                resources: await page.evaluate(() =>
                  performance
                    .getEntriesByType('resource')
                    .map((entry) => entry.name)
                    .filter(
                      (name) =>
                        name.includes('/materials/') || name.includes('/wasm/basis/'),
                    ),
                ),
                colorCount: color.length,
                normalCount: normal.length,
                roughnessCount: roughness.length,
              }),
            );
          } finally {
            await context.close();
            await browser.close();
          }
          NODE

# rerun-with-basis-transcoder
