name: Vendor Deadshot Open Source Artifacts

on:
  push:
    branches:
      - vendor/deadshot-open-source-artifacts

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: vendor/deadshot-open-source-artifacts
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download pinned MIT Deadshot production-pipeline artifacts
        run: |
          set -euo pipefail
          COMMIT="f009e88ee67921eb4c4625c1fa47ca1f6f311737"
          BASE="https://raw.githubusercontent.com/GoalieSave25/webgl-lightmap-baker/$COMMIT"
          DEST="vendor/deadshot-open-source/webgl-lightmap-baker"
          mkdir -p "$DEST/public/maps/dust2" "$DEST/public/output"

          curl -L --fail --retry 3 "$BASE/LICENSE" -o "$DEST/LICENSE"
          curl -L --fail --retry 3 "$BASE/README.md" -o "$DEST/README.md"
          curl -L --fail --retry 3 "$BASE/index.js" -o "$DEST/index.js"
          curl -L --fail --retry 3 "$BASE/package.json" -o "$DEST/package.json"
          curl -L --fail --retry 3 "$BASE/public/index.html" -o "$DEST/public/index.html"
          curl -L --fail --retry 3 "$BASE/public/example.html" -o "$DEST/public/example.html"
          curl -L --fail --retry 3 "$BASE/public/maps/dust2/input.glb" -o "$DEST/public/maps/dust2/input.glb"
          curl -L --fail --retry 3 "$BASE/public/output/gioutput.gltf" -o "$DEST/public/output/gioutput.gltf"
          curl -L --fail --retry 3 "$BASE/public/output/lightmap.png" -o "$DEST/public/output/lightmap.png"

          cat > "$DEST/SOURCE.md" <<EOF
          # Source provenance

          Upstream: https://github.com/GoalieSave25/webgl-lightmap-baker
          Pinned commit: $COMMIT
          License: MIT
          Purpose: Open-source WebGL lightmap baking pipeline explicitly documented by upstream as made for and used in the production pipeline for deadshot.io.

          Vendored files:
          - LICENSE
          - README.md
          - index.js
          - package.json
          - public/index.html
          - public/example.html
          - public/maps/dust2/input.glb
          - public/output/gioutput.gltf
          - public/output/lightmap.png
          EOF

          find "$DEST" -type f -maxdepth 4 -printf "%p %s bytes\n" | sort

      - name: Commit vendored artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/deadshot-open-source/
          if ! git diff --cached --quiet; then
            git commit -m "Vendor MIT Deadshot production pipeline artifacts"
            git push
          fi
