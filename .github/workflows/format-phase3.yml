name: Format Phase 3

on:
  push:
    branches: [phase/3-ravenwood]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: phase/3-ravenwood
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply repository formatter
        run: npm run format

      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hideverse-format[bot]"
          git config user.email "hideverse-format[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git add .
          git commit -m "style: format Phase 3 Ravenwood"
          git push origin HEAD:phase/3-ravenwood
