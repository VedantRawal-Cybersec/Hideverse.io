name: Temporary Combat Formatter

on:
  push:
    branches:
      - phase/combat-fx-polish

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase/combat-fx-polish
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write apps/game/src/core/combat-system.ts apps/game/src/core/audio-feedback.ts apps/game/src/main.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/game/src/core/combat-system.ts apps/game/src/core/audio-feedback.ts apps/game/src/main.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format combat FX polish"
            git push
          fi
