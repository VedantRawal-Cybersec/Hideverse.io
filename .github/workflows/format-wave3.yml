name: Temporary Wave 3 Formatter

on:
  push:
    branches:
      - feature/realism-wave3-secondary-v2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/realism-wave3-secondary-v2
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - run: npm install --no-audit --no-fund
      - run: npx prettier --write apps/game/src/maps/map-detail-pass.ts apps/game/scripts/verify-release.mjs
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/game/src/maps/map-detail-pass.ts apps/game/scripts/verify-release.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Format Wave 3 realism pass"
            git push
          fi
