name: Game V2 Primary Live QA

on:
  push:
    branches:
      - qa/v2-primary-live

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [desktop, mobile]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2

      - name: Install Playwright
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify live V2 primary route
        env:
          PROFILE: ${{ matrix.profile }}
          LIVE_URL: https://hideverse-io.onrender.com
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const mobile = process.env.PROFILE === 'mobile';
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext(
            mobile
              ? {
                  viewport: { width: 844, height: 390 },
                  hasTouch: true,
                  isMobile: true,
                  deviceScaleFactor: 2,
                }
              : {
                  viewport: { width: 1280, height: 720 },
                  deviceScaleFactor: 1,
                },
          );
          const page = await context.newPage();
          const pageErrors = [];
          const consoleErrors = [];
          const failed = [];
          const diagnostics = [];

          page.on('pageerror', (error) => pageErrors.push(String(error)));
          page.on('console', (message) => {
            const value = message.text();
            if (message.type() === 'error') consoleErrors.push(value);
            if (/^\[(boot|world|render|materials|sky|quality|engine)\]/.test(value)) {
              diagnostics.push(value);
            }
          });
          page.on('requestfailed', (request) => {
            failed.push({
              url: request.url(),
              error: request.failure()?.errorText ?? 'unknown',
            });
          });

          try {
            const start = Date.now();
            const response = await page.goto(
              `${process.env.LIVE_URL}/game/?mp=0&q=performance&prewarm=0`,
              { waitUntil: 'domcontentloaded', timeout: 90000 },
            );
            const bootResponse = response?.status() ?? 0;

            await page.waitForFunction(() => window.__READY__ === true, null, {
              timeout: 70000,
            });
            const bootMs = Date.now() - start;
            await page.waitForTimeout(800);

            const result = await page.evaluate(() => {
              let mapId = null;
              try {
                mapId =
                  window.__ENGINE__?.ctx?.get?.('world')?.map?.id ??
                  window.__ENGINE__?.registry?.get?.('world')?.map?.id ??
                  window.__ENGINE__?.get?.('world')?.map?.id ??
                  null;
              } catch {}
              return {
                path: location.pathname,
                search: location.search,
                ready: window.__READY__ === true,
                engine: Boolean(window.__ENGINE__),
                frame: window.__ENGINE__?.time?.frame ?? 0,
                touch: document.body.classList.contains('wm-touch'),
                canvas: (() => {
                  const rect = document.querySelector('#game')?.getBoundingClientRect();
                  return rect ? { width: rect.width, height: rect.height } : null;
                })(),
                mapId,
                title: document.title,
                hideverseWordmark: document.body.textContent?.includes('HIDEVERSE') ?? false,
              };
            });

            const wsHealth = await page.evaluate(async () => {
              return new Promise((resolve) => {
                const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
                const ws = new WebSocket(`${proto}//${location.host}/ws`);
                const timer = setTimeout(() => {
                  try { ws.close(); } catch {}
                  resolve({ ok: false, reason: 'timeout' });
                }, 7000);
                ws.addEventListener('message', (event) => {
                  try {
                    const msg = JSON.parse(event.data);
                    if (msg?.t === 'hello') {
                      clearTimeout(timer);
                      ws.close();
                      resolve({ ok: true, id: msg.id });
                    }
                  } catch {}
                });
                ws.addEventListener('error', () => {
                  clearTimeout(timer);
                  resolve({ ok: false, reason: 'error' });
                }, { once: true });
              });
            });

            const summary = {
              profile: process.env.PROFILE,
              bootResponse,
              bootMs,
              result,
              wsHealth,
              pageErrors,
              consoleErrors,
              failed,
              diagnostics: diagnostics.slice(-20),
            };
            console.log('[v2-primary-live]', JSON.stringify(summary));

            if (result.path !== '/game-v2/') throw new Error(`/game/ did not redirect to V2: ${result.path}`);
            if (!result.ready || !result.engine || result.frame < 3) throw new Error('V2 did not reach running state');
            if (!result.canvas || result.canvas.width < 300 || result.canvas.height < 300) throw new Error('V2 canvas is not playable');
            if (mobile && !result.touch) throw new Error('Mobile touch mode did not activate');
            if (!mobile && result.touch) throw new Error('Desktop incorrectly activated touch mode');
            if (!wsHealth.ok) throw new Error(`WebSocket relay unavailable: ${wsHealth.reason}`);
            if (pageErrors.length || consoleErrors.length || failed.length) throw new Error('Live runtime/network errors detected');
            if (bootMs > 30000) throw new Error(`Live V2 boot too slow: ${bootMs}ms`);
          } finally {
            await context.close();
            await browser.close();
          }
          NODE
