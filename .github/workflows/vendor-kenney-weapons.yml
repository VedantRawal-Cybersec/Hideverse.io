name: Vendor Kenney FPS Weapons

on:
  push:
    branches:
      - phase/full-graphics-completion

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase/full-graphics-completion
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download pinned CC0 Kenney weapons
        run: |
          set -euo pipefail
          COMMIT="3694c6879e487c108f55677be7dd2ca75b07cc3b"
          BASE="https://raw.githubusercontent.com/shorepine/kenney/$COMMIT"
          DEST="assets/runtime/weapons/kenney"
          mkdir -p "$DEST"
          curl -L --fail --retry 3 "$BASE/3d/weapon/machinegun.glb" -o "$DEST/machinegun.glb"
          curl -L --fail --retry 3 "$BASE/3d/weapon/pistol.glb" -o "$DEST/pistol.glb"
          curl -L --fail --retry 3 "$BASE/3d/weapon/shotgun.glb" -o "$DEST/shotgun.glb"
          curl -L --fail --retry 3 "$BASE/LICENSE.txt" -o "$DEST/LICENSE.txt"
          cat > "$DEST/SOURCE.md" <<EOF
          # Source provenance

          Source repository: https://github.com/shorepine/kenney
          Pinned commit: $COMMIT
          Source pack: Kenney Weapon Pack
          License: CC0-1.0

          Runtime files:
          - machinegun.glb
          - pistol.glb
          - shotgun.glb
          EOF

      - name: Commit weapons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/runtime/weapons/kenney
          if ! git diff --cached --quiet; then
            git commit -m "Vendor CC0 Kenney FPS weapons"
            git push
          fi
