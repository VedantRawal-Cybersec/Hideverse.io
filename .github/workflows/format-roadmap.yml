name: Format Roadmap Branch

on:
  push:
    branches:
      - phase/4-8-complete-roadmap
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout roadmap branch
        uses: actions/checkout@v7
        with:
          ref: phase/4-8-complete-roadmap

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Format roadmap files
        run: |
          npx prettier --write             apps/game/index.html             apps/game/scripts/verify-roadmap.mjs             apps/game/src/core/character-system.ts             apps/game/src/core/multiplayer-client.ts             apps/game/src/maps/map-catalog.ts             apps/game/src/maps/map-data.json             apps/game/src/maps/procedural-map.ts             apps/game/src/styles.css             apps/web/src/styles.css

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             apps/game/index.html             apps/game/scripts/verify-roadmap.mjs             apps/game/src/core/character-system.ts             apps/game/src/core/multiplayer-client.ts             apps/game/src/maps/map-catalog.ts             apps/game/src/maps/map-data.json             apps/game/src/maps/procedural-map.ts             apps/game/src/styles.css             apps/web/src/styles.css
          git commit -m "chore: format phases 4-8"
          git push origin HEAD:phase/4-8-complete-roadmap
