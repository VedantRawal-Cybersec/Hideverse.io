name: Vendor Final FPS Assets

on:
  push:
    branches:
      - phase/full-game-final

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase/full-game-final
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Bring verified weapon audio and foundation provenance
        run: |
          set -euo pipefail
          git fetch origin phase/full-graphics-completion
          git checkout origin/phase/full-graphics-completion --             assets/runtime/weapons/kenney             assets/runtime/audio/kenney-fps             vendor/playcanvas-fps-foundation

      - name: Add CC0 Quaternius SMG
        run: |
          set -euo pipefail
          mkdir -p assets/runtime/weapons/quaternius
          COMMIT="2084aafce812eb75169d68b25eba7290b6c57f70"
          BASE="https://raw.githubusercontent.com/AetherRadar/operation-steel-tide/$COMMIT/assets/models/quaternius_ultimate_guns"
          curl -L --fail --retry 3 "$BASE/mp5a5.glb" -o assets/runtime/weapons/quaternius/mp5a5.glb
          curl -L --fail --retry 3 "$BASE/LICENSE.md" -o assets/runtime/weapons/quaternius/LICENSE.md
          cat > assets/runtime/weapons/quaternius/SOURCE.md <<EOF
          # Source provenance

          Model: Quaternius Ultimate Guns Pack — Submachine Gun
          Creator: Quaternius
          Upstream tracked repository: https://github.com/AetherRadar/operation-steel-tide
          Pinned commit: $COMMIT
          Tracked path: assets/models/quaternius_ultimate_guns/mp5a5.glb
          Original source pack: https://poly.pizza/bundle/Ultimate-Guns-Pack-cpgUfI4t2F
          License: CC0 1.0 Universal
          Runtime use: Hideverse RIFT SMG first-person viewmodel.
          EOF

      - name: Merge weapon manifest records
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const path = 'assets/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));

          const records = [
            {
              id: 'kenney-weapon-machinegun',
              name: 'Kenney Machine Gun',
              category: 'weapon',
              source: 'Kenney Weapon Pack',
              sourceRepo: 'shorepine/kenney',
              sourceCommit: '3694c6879e487c108f55677be7dd2ca75b07cc3b',
              sourcePath: '3d/weapon/machinegun.glb',
              sourceUrl: 'https://github.com/shorepine/kenney/blob/3694c6879e487c108f55677be7dd2ca75b07cc3b/3d/weapon/machinegun.glb',
              license: 'CC0-1.0',
              status: 'acquired',
              localFiles: [
                'assets/runtime/weapons/kenney/machinegun.glb',
                'assets/runtime/weapons/kenney/LICENSE.txt',
                'assets/runtime/weapons/kenney/SOURCE.md'
              ],
              notes: 'Compact CC0 browser FPS weapon model used for first-person viewmodel presentation.',
              runtimeStats: { bytes: 32696 }
            },
            {
              id: 'kenney-weapon-shotgun',
              name: 'Kenney Shotgun',
              category: 'weapon',
              source: 'Kenney Weapon Pack',
              sourceRepo: 'shorepine/kenney',
              sourceCommit: '3694c6879e487c108f55677be7dd2ca75b07cc3b',
              sourcePath: '3d/weapon/shotgun.glb',
              sourceUrl: 'https://github.com/shorepine/kenney/blob/3694c6879e487c108f55677be7dd2ca75b07cc3b/3d/weapon/shotgun.glb',
              license: 'CC0-1.0',
              status: 'acquired',
              localFiles: [
                'assets/runtime/weapons/kenney/shotgun.glb',
                'assets/runtime/weapons/kenney/LICENSE.txt',
                'assets/runtime/weapons/kenney/SOURCE.md'
              ],
              notes: 'Compact CC0 browser FPS weapon model used for first-person viewmodel presentation.',
              runtimeStats: { bytes: 44192 }
            },
            {
              id: 'quaternius-weapon-mp5a5',
              name: 'Quaternius Submachine Gun',
              category: 'weapon',
              source: 'Quaternius Ultimate Guns Pack',
              sourceRepo: 'AetherRadar/operation-steel-tide',
              sourceCommit: '2084aafce812eb75169d68b25eba7290b6c57f70',
              sourcePath: 'assets/models/quaternius_ultimate_guns/mp5a5.glb',
              sourceUrl: 'https://github.com/AetherRadar/operation-steel-tide/blob/2084aafce812eb75169d68b25eba7290b6c57f70/assets/models/quaternius_ultimate_guns/mp5a5.glb',
              license: 'CC0-1.0',
              status: 'acquired',
              localFiles: [
                'assets/runtime/weapons/quaternius/mp5a5.glb',
                'assets/runtime/weapons/quaternius/LICENSE.md',
                'assets/runtime/weapons/quaternius/SOURCE.md'
              ],
              notes: 'CC0 low-poly SMG viewmodel source retained with explicit provenance.',
              runtimeStats: { bytes: 70976 }
            }
          ];

          const ids = new Set(manifest.assets.map((asset) => asset.id));
          for (const record of records) {
            if (!ids.has(record.id)) manifest.assets.push(record);
          }
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
          NODE

      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/runtime/weapons assets/runtime/audio/kenney-fps vendor/playcanvas-fps-foundation assets/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Vendor final open-source FPS assets"
            git push
          fi
