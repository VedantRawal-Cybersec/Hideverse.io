name: Temporary V2 Formatter

on:
  push:
    branches:
      - migration/workmelt-game-v2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: migration/workmelt-game-v2
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write apps/web/scripts/embed-game.mjs package.json
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/scripts/embed-game.mjs package.json
          if ! git diff --cached --quiet; then
            git commit -m "Format Game V2 integration"
            git push
          fi
