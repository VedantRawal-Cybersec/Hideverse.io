name: V2 Human Graphics Live QA

on:
  push:
    branches:
      - qa/v2-human-graphics-live

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        case:
          - name: nuketown-desktop
            map: nuketown
            touch: "0"
          - name: wilmot-desktop
            map: wilmot
            touch: "0"
          - name: nuketown-mobile
            map: nuketown
            touch: "1"
          - name: wilmot-mobile
            map: wilmot
            touch: "1"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - name: Install Playwright
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify V2 live
        env:
          CASE_NAME: ${{ matrix.case.name }}
          MAP_ID: ${{ matrix.case.map }}
          TOUCH: ${{ matrix.case.touch }}
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const touch = process.env.TOUCH === '1';
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext(
            touch
              ? { viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true, deviceScaleFactor: 2 }
              : { viewport: { width: 1440, height: 900 }, deviceScaleFactor: 1 },
          );
          const page = await context.newPage();
          const pageErrors = [];
          const consoleErrors = [];
          const failed = [];
          const badResponses = [];

          page.on('pageerror', e => pageErrors.push(String(e)));
          page.on('console', m => {
            if (m.type() === 'error') consoleErrors.push(m.text());
          });
          page.on('requestfailed', r => failed.push({ url: r.url(), error: r.failure()?.errorText ?? 'unknown' }));
          page.on('response', r => {
            if (r.status() >= 500) badResponses.push({ url: r.url(), status: r.status() });
          });

          try {
            const url =
              `https://hideverse-io.onrender.com/game-v2/?map=${process.env.MAP_ID}&match=0&mp=0&touch=${process.env.TOUCH}&prewarm=0`;
            const started = Date.now();
            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 90000 });
            await page.waitForFunction(() => window.__READY__ === true, null, { timeout: 90000 });
            const bootMs = Date.now() - started;
            await page.waitForTimeout(2500);

            const stats = await page.evaluate(async () => {
              const samples = [];
              let last = performance.now();
              const until = last + 4000;
              await new Promise(resolve => {
                const tick = now => {
                  samples.push(now - last);
                  last = now;
                  if (now >= until) resolve();
                  else requestAnimationFrame(tick);
                };
                requestAnimationFrame(tick);
              });
              const sorted = [...samples].sort((a,b) => a-b);
              const avg = samples.reduce((a,b) => a+b,0) / samples.length;
              const p = q => sorted[Math.min(sorted.length-1, Math.floor(sorted.length*q))] ?? 0;
              const canvas = document.querySelector('#game')?.getBoundingClientRect();
              return {
                averageFps: 1000/avg,
                p95Ms: p(.95),
                p99Ms: p(.99),
                frames: samples.length,
                canvas: canvas ? { width: canvas.width, height: canvas.height } : null,
                ready: window.__READY__ === true,
                quality: window.__ENGINE__?.ctx?.config?.quality ?? window.__ENGINE__?.config?.quality ?? null,
              };
            });

            const summary = {
              case: process.env.CASE_NAME,
              bootMs,
              stats,
              pageErrors,
              consoleErrors,
              failed,
              badResponses,
            };
            console.log('[v2-live-qa]', JSON.stringify(summary));

            if (!stats.ready || !stats.canvas || stats.canvas.width < 300 || stats.canvas.height < 300)
              throw new Error('V2 canvas/ready check failed');
            if (pageErrors.length || consoleErrors.length || failed.length || badResponses.length)
              throw new Error('V2 runtime/network errors detected');
          } finally {
            await context.close();
            await browser.close();
          }
          NODE
