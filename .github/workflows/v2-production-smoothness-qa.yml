name: V2 Production Boot Profile

on:
  push:
    branches:
      - qa/v2-production-smoothness

permissions:
  contents: read

jobs:
  boot-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - name: desktop-auto-match
            mobile: "false"
            query: "mp=0&map=nuketown"
          - name: desktop-performance-direct
            mobile: "false"
            query: "mp=0&match=0&q=performance&map=nuketown"
          - name: mobile-auto-match
            mobile: "true"
            query: "mp=0&map=nuketown"
          - name: mobile-performance-direct
            mobile: "true"
            query: "mp=0&match=0&q=performance&map=nuketown"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2

      - name: Install Playwright
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Profile live V2 boot
        env:
          CASE_NAME: ${{ matrix.scenario.name }}
          MOBILE: ${{ matrix.scenario.mobile }}
          QUERY: ${{ matrix.scenario.query }}
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const mobile = process.env.MOBILE === 'true';
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext(
            mobile
              ? {
                  viewport: { width: 390, height: 844 },
                  hasTouch: true,
                  isMobile: true,
                  deviceScaleFactor: 2,
                }
              : { viewport: { width: 1280, height: 720 }, deviceScaleFactor: 1 },
          );
          const page = await context.newPage();
          const started = Date.now();
          const trace = [];
          const errors = [];

          page.on('console', (message) => {
            const value = message.text();
            if (
              value.startsWith('[engine]') ||
              value.startsWith('[boot]') ||
              value.startsWith('[world]') ||
              value.startsWith('[render]') ||
              value.startsWith('[materials]') ||
              value.startsWith('[sky]') ||
              value.startsWith('[physics]') ||
              value.startsWith('[ai]') ||
              value.startsWith('[ui]') ||
              value.startsWith('[quality]') ||
              value.startsWith('[match]')
            ) {
              const row = { atMs: Date.now() - started, value };
              trace.push(row);
              console.log('[v2-trace]', JSON.stringify(row));
            }
            if (message.type() === 'error') errors.push(value);
          });
          page.on('pageerror', (error) => errors.push(String(error)));

          try {
            await page.goto(
              `https://hideverse-io.onrender.com/game/?${process.env.QUERY}`,
              { waitUntil: 'domcontentloaded', timeout: 90000 },
            );
            await page.waitForFunction(() => window.__READY__ === true, null, {
              timeout: 70000,
            });
            const readyMs = Date.now() - started;
            const result = await page.evaluate(() => ({
              href: location.href,
              frame: window.__ENGINE__?.time?.frame ?? 0,
              quality: window.__ENGINE__?.config?.quality ?? null,
              renderScale: window.__ENGINE__?.config?.q?.renderScale ?? null,
              touch: document.body.classList.contains('wm-touch'),
              prewarm: window.__PREWARM__ ?? null,
            }));

            console.log(
              '[v2-boot-profile]',
              JSON.stringify({
                scenario: process.env.CASE_NAME,
                readyMs,
                result,
                errors,
                trace,
              }),
            );
            if (errors.length) throw new Error('Runtime errors detected');
          } finally {
            await context.close();
            await browser.close();
          }
          NODE
