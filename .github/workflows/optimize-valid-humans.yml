name: Optimize VALID Humans

on:
  push:
    branches:
      - rebuild/template-fps-core

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rebuild/template-fps-core
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2

      - run: npm install --no-audit --no-fund

      - name: Optimize human GLBs for browser runtime
        run: |
          set -euo pipefail
          DIR="apps/game-next/public/assets/humans"
          for name in operator_a operator_b; do
            npx gltf-transform resize "$DIR/$name.glb" "$DIR/$name.resize.glb" --width 1024 --height 1024
            npx gltf-transform optimize "$DIR/$name.resize.glb" "$DIR/$name.opt.glb" --texture-compress webp
            mv "$DIR/$name.opt.glb" "$DIR/$name.glb"
            rm -f "$DIR/$name.resize.glb"
          done
          ls -lh "$DIR"

      - name: Commit optimized humans
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/game-next/public/assets/humans/
          if ! git diff --cached --quiet; then
            git commit -m "Optimize VALID humans for browser runtime"
            git push
          fi
