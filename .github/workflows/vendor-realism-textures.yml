name: Vendor Realism Textures

on:
  push:
    branches:
      - visual/real-materials-pass

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: visual/real-materials-pass
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download pinned CC0 texture previews
        run: |
          set -euo pipefail
          COMMIT="fcc4ff97a5a843dc2e242ec9e195389bc46ed7d2"
          BASE="https://raw.githubusercontent.com/Papyszoo/CC0-Public-Domain-Textures/$COMMIT"
          DEST="assets/runtime/materials/cc0"
          mkdir -p "$DEST"

          curl -L --fail --retry 3 "$BASE/LICENSE" -o "$DEST/LICENSE-CC0.txt"
          curl -L --fail --retry 3 "$BASE/packs/ambientcg-textures/textures/Plaster001/Plaster001_1K-PNG_Color_preview.png" -o "$DEST/plaster-wall.png"
          curl -L --fail --retry 3 "$BASE/packs/ambientcg-textures/textures/Concrete013/Concrete013_1K-PNG_Color_preview.png" -o "$DEST/concrete-wall.png"
          curl -L --fail --retry 3 "$BASE/packs/ambientcg-textures/textures/Bricks004/Bricks004_1K-PNG_Color_preview.png" -o "$DEST/brick-wall.png"
          curl -L --fail --retry 3 "$BASE/packs/ambientcg-textures/textures/Asphalt007/Asphalt007_1K-PNG_Color_preview.png" -o "$DEST/asphalt-floor.png"
          curl -L --fail --retry 3 "$BASE/packs/ambientcg-textures/textures/Tiles010/Tiles010_1K-PNG_Color_preview.png" -o "$DEST/tile-floor.png"
          curl -L --fail --retry 3 "$BASE/packs/ambientcg-textures/textures/Metal012/Metal012_1K-PNG_Color_preview.png" -o "$DEST/metal.png"
          curl -L --fail --retry 3 "$BASE/packs/ambientcg-textures/textures/Wood011/Wood011_1K-PNG_Color_preview.png" -o "$DEST/wood.png"

          cat > "$DEST/SOURCE.md" <<EOF
          # Hideverse CC0 surface texture provenance

          Upstream: https://github.com/Papyszoo/CC0-Public-Domain-Textures
          Pinned commit: $COMMIT
          License: CC0 1.0 Universal
          Runtime goal: tiny tiled color textures for wall/floor/metal/wood realism while preserving mobile frame rate.

          Files are lightweight catalog preview textures, intentionally chosen instead of high-resolution masters.
          EOF

          find "$DEST" -type f -maxdepth 1 -printf "%f %s bytes\n" | sort

      - name: Commit textures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/runtime/materials/cc0/
          if ! git diff --cached --quiet; then
            git commit -m "Vendor lightweight CC0 realism textures"
            git push
          fi
