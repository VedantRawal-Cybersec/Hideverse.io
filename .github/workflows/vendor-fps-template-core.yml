name: Vendor MIT FPS Template Core

on:
  push:
    branches:
      - rebuild/template-fps-core

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rebuild/template-fps-core
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch pinned upstream template
        run: |
          set -euo pipefail
          UPSTREAM="https://github.com/mshaheerz/fpp-tpp-shooter-starter.git"
          COMMIT="00f17a932e46dcb6183e4dba8c7a31643025fc26"
          git clone --filter=blob:none "$UPSTREAM" /tmp/fps-template
          cd /tmp/fps-template
          git checkout "$COMMIT"

      - name: Vendor code-only template into apps/game-next
        run: |
          set -euo pipefail
          rm -rf apps/game-next
          mkdir -p apps/game-next
          cp -R /tmp/fps-template/src apps/game-next/src
          cp /tmp/fps-template/index.html apps/game-next/index.html
          cp /tmp/fps-template/vite.config.ts apps/game-next/vite.config.ts
          cp /tmp/fps-template/tsconfig.json apps/game-next/tsconfig.json
          cp /tmp/fps-template/LICENSE apps/game-next/UPSTREAM_LICENSE
          cp /tmp/fps-template/README.md apps/game-next/UPSTREAM_README.md

          if [ -d /tmp/fps-template/studio ]; then
            cp -R /tmp/fps-template/studio apps/game-next/studio
          fi

          cat > apps/game-next/package.json <<'EOF'
          {
            "name": "@hideverse/game-next",
            "private": true,
            "version": "0.1.0",
            "type": "module",
            "scripts": {
              "dev": "vite",
              "build": "tsc --noEmit && vite build",
              "typecheck": "tsc --noEmit",
              "verify": "npm run typecheck && npm run build"
            },
            "dependencies": {
              "@dimforge/rapier3d-compat": "^0.14.0",
              "three": "^0.169.0"
            },
            "devDependencies": {
              "@types/node": "^25.9.1",
              "@types/three": "^0.169.0",
              "typescript": "^5.6.2",
              "vite": "^8.0.16"
            }
          }
          EOF

          cat > apps/game-next/TEMPLATE_PROVENANCE.md <<'EOF'
          # Template provenance

          Base code: mshaheerz/fpp-tpp-shooter-starter
          Upstream commit: 00f17a932e46dcb6183e4dba8c7a31643025fc26
          Code license: MIT

          This directory intentionally vendors the upstream application source code and configuration only.

          Bundled upstream character models, Mixamo-derived animations, weapons, maps, audio and other third-party assets were NOT copied by this workflow. They must be reviewed and replaced with assets whose redistribution terms are compatible with Hideverse before production use.
          EOF

          node - <<'NODE'
          const fs = require('fs');
          const path = 'apps/game-next/index.html';
          let html = fs.readFileSync(path, 'utf8');
          html = html.replaceAll('FPP + TPP FPS Starter', 'HIDEVERSE NEXT');
          html = html.replaceAll('CLICK TO PLAY', 'ENTER HIDEVERSE');
          fs.writeFileSync(path, html);
          NODE

      - name: Install and compile template workspace
        run: |
          npm install --no-audit --no-fund
          npm run build --workspace @hideverse/game-next

      - name: Commit vendored template core
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/game-next package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Vendor MIT FPS template core for Hideverse rebuild"
            git push
          fi
