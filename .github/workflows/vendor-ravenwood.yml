name: Vendor Ravenwood Mansion

on:
  push:
    branches: [phase/3-ravenwood]
    paths:
      - ".github/workflows/vendor-ravenwood.yml"
      - "tools/assets/promote-ravenwood.mjs"
      - "tools/assets/asset-stats.mjs"
      - "assets/manifest.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Hideverse
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2

      - name: Install project tooling
        run: npm install --no-audit --no-fund

      - name: Fetch pinned Victorian house source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/gltf-scenes /tmp/ravenwood-source
          git clone --filter=blob:none --no-checkout https://github.com/ErfanMo77/gltf-research-scenes.git /tmp/gltf-scenes
          cd /tmp/gltf-scenes
          git sparse-checkout init --cone
          git sparse-checkout set scenes/house/gltf scenes/house/source
          GIT_LFS_SKIP_SMUDGE=1 git checkout 50cbe72d462cfbbf11244d0df6a5501a74050d34
          git lfs install --local
          git lfs pull --include="scenes/house/gltf/house.bin" --exclude=""
          mkdir -p /tmp/ravenwood-source
          cp scenes/house/gltf/house_core.gltf /tmp/ravenwood-source/
          cp scenes/house/gltf/house.bin /tmp/ravenwood-source/
          cp scenes/house/source/LICENSE.txt /tmp/ravenwood-source/LICENSE.txt
          test "$(stat -c%s /tmp/ravenwood-source/house.bin)" -gt 40000000

      - name: Simplify and optimize Ravenwood architecture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/runtime/ravenwood/map /tmp/ravenwood-work
          npx gltf-transform weld             /tmp/ravenwood-source/house_core.gltf             /tmp/ravenwood-work/welded.glb
          npx gltf-transform simplify             /tmp/ravenwood-work/welded.glb             /tmp/ravenwood-work/simplified.glb             --ratio 0.18             --error 0.025             --lock-border true
          npx gltf-transform optimize             /tmp/ravenwood-work/simplified.glb             assets/runtime/ravenwood/map/ravenwood_mansion_victorian.glb             --compress quantize             --texture-compress webp             --texture-size 1024             --flatten false             --join false

      - name: Promote asset only if budgets pass
        run: node tools/assets/promote-ravenwood.mjs

      - name: Validate generated asset library
        run: npm run assets:verify

      - name: Commit optimized mansion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hideverse-build[bot]"
          git config user.email "hideverse-build[bot]@users.noreply.github.com"
          git lfs install
          git add assets/manifest.json             assets/runtime/ravenwood/map/ravenwood_mansion_victorian.glb             assets/runtime/ravenwood/map/ravenwood_mansion_victorian.meta.json
          if git diff --cached --quiet; then
            echo "No generated asset changes to commit."
            exit 0
          fi
          git commit -m "phase 3: vendor optimized Ravenwood Victorian mansion"
          git push origin HEAD:phase/3-ravenwood
