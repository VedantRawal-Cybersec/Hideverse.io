name: Live Cross-Platform Smoke

on:
  push:
    branches:
      - qa/live-cross-platform-smoke

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2

      - name: Install Playwright
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify live desktop and mobile sessions
        env:
          LIVE_URL: https://hideverse-io.onrender.com
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const live = process.env.LIVE_URL;
          const browser = await chromium.launch({ headless: true });
          const room = 'LIVE-QA-72373D';

          async function openClient(label, options) {
            const context = await browser.newContext(options);
            const page = await context.newPage();
            const pageErrors = [];
            const consoleErrors = [];
            const riggedResponses = [];

            page.on('pageerror', (error) => pageErrors.push(String(error)));
            page.on('console', (message) => {
              if (message.type() === 'error') consoleErrors.push(message.text());
            });
            page.on('response', (response) => {
              if (response.url().includes('Rogue_Hooded.glb')) {
                riggedResponses.push({ url: response.url(), status: response.status() });
              }
            });

            await page.goto(
              `${live}/game/?map=axiom&room=${room}&debug=1`,
              { waitUntil: 'domcontentloaded', timeout: 60000 },
            );
            await page.waitForSelector('#boot-overlay.is-hidden', { timeout: 60000 });
            await page.waitForTimeout(3500);

            const result = await page.evaluate(() => {
              const canvas = document.querySelector('#game-canvas');
              const peers = document.querySelector('#peers-value')?.textContent ?? '';
              const status = document.querySelector('#map-status')?.textContent ?? '';
              const network = document.querySelector('#network-value')?.textContent ?? '';
              const quality = document.querySelector('#quality-select')?.value ?? '';
              const mobile = getComputedStyle(document.querySelector('.mobile-controls')).display;
              const rect = canvas?.getBoundingClientRect();
              return {
                peers,
                status,
                network,
                quality,
                mobile,
                coarse: matchMedia('(pointer: coarse)').matches,
                canvasWidth: rect?.width ?? 0,
                canvasHeight: rect?.height ?? 0,
              };
            });

            if (result.canvasWidth < 300 || result.canvasHeight < 300) {
              throw new Error(`${label}: canvas did not render: ${JSON.stringify(result)}`);
            }
            if (/boot failed|failed to start/i.test(result.status)) {
              throw new Error(`${label}: game boot failed: ${result.status}`);
            }
            if (!/ONLINE/.test(result.network)) {
              throw new Error(`${label}: multiplayer is not online: ${JSON.stringify(result)}`);
            }
            if (pageErrors.length) {
              throw new Error(`${label}: page errors: ${pageErrors.join(' | ')}`);
            }
            if (consoleErrors.length) {
              throw new Error(`${label}: console errors: ${consoleErrors.join(' | ')}`);
            }

            return { context, page, result, riggedResponses };
          }

          try {
            const desktop = await openClient('desktop', {
              viewport: { width: 1440, height: 900 },
              hasTouch: false,
              isMobile: false,
            });
            const mobile = await openClient('mobile', {
              viewport: { width: 390, height: 844 },
              hasTouch: true,
              isMobile: true,
              deviceScaleFactor: 2,
            });

            await desktop.page.waitForFunction(
              () => Number(document.querySelector('#peers-value')?.textContent ?? '0') >= 1,
              { timeout: 15000 },
            );
            await mobile.page.waitForFunction(
              () => Number(document.querySelector('#peers-value')?.textContent ?? '0') >= 1,
              { timeout: 15000 },
            );

            const desktopPeers = await desktop.page.textContent('#peers-value');
            const mobilePeers = await mobile.page.textContent('#peers-value');
            if (Number(desktopPeers) < 1 || Number(mobilePeers) < 1) {
              throw new Error(`peer sync failed desktop=${desktopPeers} mobile=${mobilePeers}`);
            }

            if (!desktop.riggedResponses.some((entry) => entry.status === 200)) {
              throw new Error(
                `desktop: rigged character was not loaded successfully: ${JSON.stringify(desktop.riggedResponses)}`,
              );
            }
            if (mobile.riggedResponses.length !== 0) {
              throw new Error(
                `mobile: heavy rigged character should not load: ${JSON.stringify(mobile.riggedResponses)}`,
              );
            }
            if (!mobile.result.coarse || mobile.result.mobile === 'none') {
              throw new Error(`mobile controls/profile inactive: ${JSON.stringify(mobile.result)}`);
            }

            await mobile.page.locator('#mobile-jump').tap();
            await mobile.page.locator('#mobile-interact').tap();
            await mobile.page.waitForTimeout(500);

            console.log(
              '[live-cross-platform] PASS',
              JSON.stringify({
                desktop: desktop.result,
                mobile: mobile.result,
                desktopRiggedAsset: desktop.riggedResponses,
                peers: { desktop: desktopPeers, mobile: mobilePeers },
              }),
            );

            await desktop.context.close();
            await mobile.context.close();
          } finally {
            await browser.close();
          }
          NODE
