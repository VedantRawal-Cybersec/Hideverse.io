name: Live Real Materials QA

on:
  push:
    branches:
      - qa/live-real-materials

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        case:
          - name: nexus-desktop
            map: nexus
            mobile: "false"
          - name: hospital-desktop
            map: hospital
            mobile: "false"
          - name: ravenwood-mobile
            map: ravenwood
            mobile: "true"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - run: npm install --no-save --no-audit --no-fund playwright@1.55.0
      - run: npx playwright install --with-deps chromium

      - name: Verify live materials
        env:
          LIVE_URL: https://hideverse-io.onrender.com
          MAP_ID: ${{ matrix.case.map }}
          MOBILE: ${{ matrix.case.mobile }}
          CASE_NAME: ${{ matrix.case.name }}
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext(
            process.env.MOBILE === 'true'
              ? {
                  viewport: { width: 390, height: 844 },
                  hasTouch: true,
                  isMobile: true,
                  deviceScaleFactor: 2,
                }
              : { viewport: { width: 1440, height: 900 } },
          );
          const page = await context.newPage();
          const errors = [];
          const textures = [];

          page.on('pageerror', (error) => errors.push(String(error)));
          page.on('response', (response) => {
            if (response.url().includes('/materials/cc0/')) {
              textures.push({ url: response.url(), status: response.status() });
            }
          });

          try {
            await page.goto(
              `${process.env.LIVE_URL}/game/?map=${process.env.MAP_ID}&room=LIVE-MATERIAL-QA`,
              { waitUntil: 'domcontentloaded', timeout: 90000 },
            );
            await page.waitForSelector('#boot-overlay.is-hidden', { timeout: 90000 });
            await page.waitForTimeout(4500);

            const state = await page.evaluate(() => ({
              fps: document.querySelector('#fps-value')?.textContent ?? '',
              quality: document.querySelector('#quality-select')?.value ?? '',
              status: document.querySelector('#map-status')?.textContent ?? '',
              canvas: document.querySelector('#game-canvas')?.getBoundingClientRect().toJSON?.() ?? null,
            }));

            const successful = textures.filter((entry) => entry.status === 200);
            console.log('[live-real-materials]', JSON.stringify({
              case: process.env.CASE_NAME,
              state,
              textures: successful,
              errors,
            }));

            if (errors.length) throw new Error(errors.join(' | '));
            if (successful.length < 3) {
              throw new Error(`Only ${successful.length} real material textures loaded successfully`);
            }
          } finally {
            await context.close();
            await browser.close();
          }
          NODE
