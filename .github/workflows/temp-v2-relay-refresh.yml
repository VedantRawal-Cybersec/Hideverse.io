name: Temporary V2 Relay Refresh

on:
  push:
    branches:
      - integration/game-v2-websocket-relay

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integration/game-v2-websocket-relay
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - name: Refresh lockfile
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Format relay integration
        run: |
          npx prettier --write             apps/web/server.mjs             apps/web/v2-relay.mjs             apps/web/package.json             apps/web/scripts/verify-multiplayer.mjs             apps/game-v2/SOURCE.md
      - name: Commit refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json apps/web apps/game-v2/SOURCE.md
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Game V2 relay lockfile and formatting"
            git push
          fi
