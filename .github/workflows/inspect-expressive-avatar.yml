name: Inspect Expressive Avatar

on:
  push:
    branches:
      - integration/full-avatar-graphics-controller-pass

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - run: npm install --no-audit --no-fund
      - name: Inspect VRM morphs
        run: npx gltf-transform inspect assets/runtime/characters/vrm/Seed-san.vrm
