name: Temporary V2 Relay Lockfile

on:
  push:
    branches:
      - phase/full-graphics-completion

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase/full-graphics-completion
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - name: Refresh lockfile
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Format touched source
        run: |
          npx prettier --write             apps/web/server.mjs             apps/web/v2-relay.mjs             apps/web/package.json             apps/web/scripts/verify-multiplayer.mjs             apps/game/src/core/map-visual-profile.ts             apps/game/src/core/environment-polish.ts             apps/game/src/core/graphics-pipeline.ts
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json apps/web apps/game/src/core
          if ! git diff --cached --quiet; then
            git commit -m "Refresh V2 relay lockfile and formatting"
            git push
          fi
