name: Temporary Smoothness Benchmark

on:
  push:
    branches:
      - perf/smoothness-first

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        case:
          - name: axiom-desktop
            map: axiom
            mobile: "false"
          - name: ravenwood-desktop
            map: ravenwood
            mobile: "false"
          - name: axiom-mobile
            map: axiom
            mobile: "true"
          - name: ravenwood-mobile
            map: ravenwood
            mobile: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2

      - run: npm install --no-audit --no-fund
      - run: npm run build:live
      - run: npm install --no-save --no-audit --no-fund playwright@1.55.0
      - run: npx playwright install --with-deps chromium

      - name: Start production server
        run: |
          PORT=43993 npm run start --workspace @hideverse/web > /tmp/hideverse-server.log 2>&1 &
          echo $! > /tmp/hideverse-server.pid
          for i in {1..50}; do
            if curl -fsS http://127.0.0.1:43993/api/multiplayer/health >/dev/null; then
              exit 0
            fi
            sleep 0.2
          done
          cat /tmp/hideverse-server.log
          exit 1

      - name: Measure frame pacing
        env:
          MAP_ID: ${{ matrix.case.map }}
          MOBILE: ${{ matrix.case.mobile }}
          CASE_NAME: ${{ matrix.case.name }}
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext(
            process.env.MOBILE === 'true'
              ? {
                  viewport: { width: 390, height: 844 },
                  hasTouch: true,
                  isMobile: true,
                  deviceScaleFactor: 2,
                }
              : { viewport: { width: 1440, height: 900 } },
          );
          const page = await context.newPage();
          const errors = [];
          page.on('pageerror', (error) => errors.push(String(error)));

          try {
            await page.goto(
              `http://127.0.0.1:43993/game/?map=${process.env.MAP_ID}&room=SMOOTH-QA`,
              { waitUntil: 'domcontentloaded', timeout: 60000 },
            );
            await page.waitForSelector('#boot-overlay.is-hidden', { timeout: 60000 });
            await page.waitForTimeout(3000);

            if (process.env.MOBILE !== 'true') {
              await page.keyboard.down('KeyW');
            }

            const stats = await page.evaluate(async () => {
              const samples = [];
              let last = performance.now();
              const deadline = last + 8000;

              await new Promise((resolve) => {
                const tick = (now) => {
                  samples.push(now - last);
                  last = now;
                  if (now >= deadline) resolve();
                  else requestAnimationFrame(tick);
                };
                requestAnimationFrame(tick);
              });

              samples.sort((a, b) => a - b);
              const percentile = (p) => samples[Math.min(samples.length - 1, Math.floor(samples.length * p))];
              const averageMs = samples.reduce((sum, value) => sum + value, 0) / samples.length;
              return {
                samples: samples.length,
                averageMs,
                averageFps: 1000 / averageMs,
                p50Ms: percentile(0.5),
                p95Ms: percentile(0.95),
                p99Ms: percentile(0.99),
                longFrames: samples.filter((value) => value > 33.4).length,
                fpsHud: document.querySelector('#fps-value')?.textContent ?? '',
                quality: document.querySelector('#quality-select')?.value ?? '',
              };
            });

            if (process.env.MOBILE !== 'true') await page.keyboard.up('KeyW');

            console.log('[smoothness-benchmark]', JSON.stringify({
              case: process.env.CASE_NAME,
              stats,
              errors,
            }));

            if (errors.length) throw new Error(errors.join(' | '));
          } finally {
            await context.close();
            await browser.close();
          }
          NODE
