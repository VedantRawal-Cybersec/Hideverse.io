name: Temporary FPS Foundation Formatter

on:
  push:
    branches:
      - template/fps-foundation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: template/fps-foundation
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - run: npm install --no-audit --no-fund
      - name: Format FPS foundation runtime
        run: >
          npx prettier --write
          apps/game/index.html
          apps/game/src/main.ts
          apps/game/src/styles.css
          apps/game/src/core/input-controller.ts
          apps/game/src/core/player-controller.ts
          apps/game/src/core/character-system.ts
          apps/game/src/core/audio-feedback.ts
          apps/game/src/core/combat-system.ts
          apps/game/scripts/verify-release.mjs
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/game
          if ! git diff --cached --quiet; then
            git commit -m "Format FPS template foundation"
            git push
          fi
