name: Vendor FPS Template Source

on:
  push:
    branches:
      - template/fps-foundation

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: template/fps-foundation
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download pinned MIT FPS template source
        run: |
          set -euo pipefail
          COMMIT="cdde0f3cca57769ad7ae610c3c890438393b24d4"
          BASE="https://raw.githubusercontent.com/kamalesh404/multiplayer-fps-game/$COMMIT"
          DEST="vendor/fps-template/bulletstorm-arena"
          mkdir -p "$DEST"
          curl -L --fail --retry 3 "$BASE/LICENSE" -o "$DEST/LICENSE"
          curl -L --fail --retry 3 "$BASE/README.md" -o "$DEST/README.md"
          curl -L --fail --retry 3 "$BASE/main.js" -o "$DEST/main.js"
          curl -L --fail --retry 3 "$BASE/server.js" -o "$DEST/server.js"
          curl -L --fail --retry 3 "$BASE/package.json" -o "$DEST/package.json"
          cat > "$DEST/SOURCE.md" <<EOF
          # Source provenance

          Upstream: https://github.com/kamalesh404/multiplayer-fps-game
          Pinned commit: $COMMIT
          Repository license: MIT
          Purpose: browser-FPS gameplay foundation/reference for Hideverse movement, ADS, recoil, weapon handling, hit feedback, HUD structure, and server combat validation.

          Imported source only:
          - LICENSE
          - README.md
          - main.js
          - server.js
          - package.json

          Deliberately NOT imported:
          - public/models/*
          - screenshots/concept images
          - maps or weapon/character models

          Reason: individual third-party asset provenance is not sufficiently documented for safe redistribution. Hideverse continues using separately verified CC0/runtime assets.
          EOF

      - name: Commit vendored source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/fps-template/bulletstorm-arena
          if ! git diff --cached --quiet; then
            git commit -m "Vendor pinned MIT browser FPS template source"
            git push
          fi
