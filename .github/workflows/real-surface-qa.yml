name: Real Surface Browser QA

on:
  push:
    branches:
      - feature/real-materials-wave1

permissions:
  contents: read

jobs:
  surface-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        case:
          - name: nexus-desktop
            map: nexus
            mobile: "false"
          - name: ravenwood-desktop
            map: ravenwood
            mobile: "false"
          - name: hospital-mobile
            map: hospital
            mobile: "true"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2

      - run: npm install --no-audit --no-fund
      - run: npm run build:live
      - run: npm install --no-save --no-audit --no-fund playwright@1.55.0
      - run: npx playwright install --with-deps chromium

      - name: Start production server
        run: |
          PORT=43994 npm run start --workspace @hideverse/web > /tmp/hideverse-surface-server.log 2>&1 &
          for i in {1..50}; do
            if curl -fsS http://127.0.0.1:43994/api/multiplayer/health >/dev/null; then
              exit 0
            fi
            sleep 0.2
          done
          cat /tmp/hideverse-surface-server.log
          exit 1

      - name: Verify real surfaces and frame pacing
        env:
          MAP_ID: ${{ matrix.case.map }}
          MOBILE: ${{ matrix.case.mobile }}
          CASE_NAME: ${{ matrix.case.name }}
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const expected = ['concrete.png', 'brick.png', 'asphalt.png', 'metal.png', 'wood.png'];
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext(
            process.env.MOBILE === 'true'
              ? {
                  viewport: { width: 390, height: 844 },
                  hasTouch: true,
                  isMobile: true,
                  deviceScaleFactor: 2,
                }
              : { viewport: { width: 1440, height: 900 } },
          );
          const page = await context.newPage();
          const errors = [];
          const surfaces = new Map();

          page.on('pageerror', (error) => errors.push(String(error)));
          page.on('response', (response) => {
            for (const name of expected) {
              if (response.url().includes('/materials/reference/') && response.url().endsWith(name)) {
                surfaces.set(name, response.status());
              }
            }
          });

          try {
            await page.goto(
              `http://127.0.0.1:43994/game/?map=${process.env.MAP_ID}&room=SURFACE-QA`,
              { waitUntil: 'domcontentloaded', timeout: 60000 },
            );
            await page.waitForSelector('#boot-overlay.is-hidden', { timeout: 60000 });
            await page.waitForTimeout(4000);

            const missing = expected.filter((name) => surfaces.get(name) !== 200);
            if (missing.length) {
              throw new Error(`real surface textures missing: ${missing.join(', ')} / seen=${JSON.stringify([...surfaces])}`);
            }

            const stats = await page.evaluate(async () => {
              const samples = [];
              let last = performance.now();
              const end = last + 4500;
              await new Promise((resolve) => {
                const tick = (now) => {
                  samples.push(now - last);
                  last = now;
                  if (now >= end) resolve();
                  else requestAnimationFrame(tick);
                };
                requestAnimationFrame(tick);
              });
              const averageMs = samples.reduce((sum, value) => sum + value, 0) / samples.length;
              return {
                samples: samples.length,
                averageFps: 1000 / averageMs,
                fpsHud: document.querySelector('#fps-value')?.textContent ?? '',
                quality: document.querySelector('#quality-select')?.value ?? '',
              };
            });

            if (stats.averageFps < 30) {
              throw new Error(`frame pacing below floor: ${JSON.stringify(stats)}`);
            }
            if (errors.length) throw new Error(errors.join(' | '));

            console.log(
              '[real-surface-qa] PASS',
              JSON.stringify({
                case: process.env.CASE_NAME,
                surfaces: Object.fromEntries(surfaces),
                stats,
              }),
            );
          } finally {
            await context.close();
            await browser.close();
          }
          NODE
