name: Live Combat FX QA

on:
  push:
    branches:
      - qa/live-combat-fx

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [desktop, mobile]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - name: Install Playwright
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Exercise live combat
        env:
          PROFILE: ${{ matrix.profile }}
          TARGET: https://hideverse-io.onrender.com/game/?map=axiom&room=COMBAT-QA
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const mobile = process.env.PROFILE === 'mobile';
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext(
            mobile
              ? {
                  viewport: { width: 390, height: 844 },
                  hasTouch: true,
                  isMobile: true,
                  deviceScaleFactor: 2,
                }
              : { viewport: { width: 1280, height: 720 }, deviceScaleFactor: 1 },
          );
          const page = await context.newPage();
          const errors = [];
          const failed = [];
          page.on('pageerror', (e) => errors.push(String(e)));
          page.on('console', (m) => {
            if (m.type() === 'error') errors.push(m.text());
          });
          page.on('requestfailed', (r) => {
            if (!r.url().includes('/api/multiplayer/events')) {
              failed.push({ url: r.url(), error: r.failure()?.errorText ?? 'unknown' });
            }
          });

          try {
            await page.goto(process.env.TARGET, {
              waitUntil: 'domcontentloaded',
              timeout: 90000,
            });
            await page.waitForSelector('#boot-overlay.is-hidden', { timeout: 90000 });
            await page.waitForTimeout(2500);

            const initialAmmo = Number(
              await page.locator('#combat-ammo').textContent(),
            );

            if (mobile) {
              await page.locator('#mobile-fire').dispatchEvent('pointerdown', {
                pointerId: 9,
                pointerType: 'touch',
              });
              await page.waitForTimeout(250);
              await page.locator('#mobile-fire').dispatchEvent('pointerup', {
                pointerId: 9,
                pointerType: 'touch',
              });
            } else {
              await page.locator('#game-canvas').click({ position: { x: 620, y: 360 } });
              await page.waitForTimeout(300);
              await page.mouse.down({ button: 'left' });
              await page.waitForTimeout(280);
              await page.mouse.up({ button: 'left' });
            }

            await page.waitForTimeout(250);
            const afterFire = Number(await page.locator('#combat-ammo').textContent());

            if (afterFire >= initialAmmo) {
              throw new Error(
                `Firing did not consume ammo: before=${initialAmmo} after=${afterFire}`,
              );
            }

            if (mobile) {
              await page.locator('#mobile-reload').dispatchEvent('pointerdown', {
                pointerId: 10,
                pointerType: 'touch',
              });
            } else {
              await page.keyboard.press('KeyR');
            }

            await page.waitForTimeout(1900);
            const afterReload = Number(await page.locator('#combat-ammo').textContent());
            const reserve = Number(await page.locator('#combat-reserve').textContent());
            const status = (await page.locator('#combat-state').textContent())?.trim();

            const summary = {
              profile: process.env.PROFILE,
              initialAmmo,
              afterFire,
              afterReload,
              reserve,
              status,
              hp: await page.locator('#combat-health').textContent(),
              armor: await page.locator('#combat-armor').textContent(),
              fps: await page.locator('#fps-value').textContent(),
              errors,
              failed,
            };
            console.log('[live-combat-fx-qa]', JSON.stringify(summary));

            if (afterReload <= afterFire) {
              throw new Error('Reload did not replenish the magazine');
            }
            if (errors.length || failed.length) {
              throw new Error('Runtime or request errors detected');
            }
          } finally {
            await context.close();
            await browser.close();
          }
          NODE
