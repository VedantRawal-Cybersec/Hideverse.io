name: Deploy Hideverse Live

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hideverse-live
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify source
        run: npm run assets:verify && npm run verify

      - name: Build portable live bundle
        run: npm run build:static

      - name: V2 browser performance gate
        run: node tools/v2-perf-gate.mjs

      - name: Verify published files
        run: |
          test -f apps/web/dist/index.html
          test -f apps/web/dist/game/index.html
          test -f apps/web/dist/game/ravenwood/map/ravenwood_mansion_victorian.glb
          test -f apps/web/dist/data/asset-summary.json

      - name: Publish live-static branch
        shell: bash
        run: |
          set -euo pipefail

          publish_dir="$(mktemp -d)"
          worktree_dir="$(mktemp -d)"

          cp -a apps/web/dist/. "$publish_dir/"

          git worktree add --detach "$worktree_dir" "$GITHUB_SHA"
          cd "$worktree_dir"
          git switch --orphan live-static
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx >/dev/null 2>&1 || true

          cp -a "$publish_dir/." .
          touch .nojekyll
          printf '%s\n' "$GITHUB_SHA" > .source-commit

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy Hideverse live from $GITHUB_SHA"
          git push --force origin HEAD:live-static
