name: Format Phase 8 Lobby

on:
  push:
    branches:
      - phase/8-lobby-polish
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lobby branch
        uses: actions/checkout@v7
        with:
          ref: phase/8-lobby-polish

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.2

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Format lobby source
        run: npx prettier --write apps/game/src/main.ts

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/game/src/main.ts
          git commit -m "chore: format phase 8 lobby"
          git push origin HEAD:phase/8-lobby-polish
