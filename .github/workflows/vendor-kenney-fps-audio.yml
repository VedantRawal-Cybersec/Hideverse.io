name: Vendor Kenney FPS Audio

on:
  push:
    branches:
      - phase/full-graphics-completion

permissions:
  contents: write

jobs:
  vendor-audio:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase/full-graphics-completion
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download pinned Kenney FPS starter CC0 audio
        run: |
          set -euo pipefail
          COMMIT="1bd8de76252015265639328210071394779ae6c6"
          BASE="https://raw.githubusercontent.com/KenneyNL/Starter-Kit-FPS/$COMMIT"
          DEST="assets/runtime/audio/kenney-fps"
          mkdir -p "$DEST"
          for FILE in blaster.ogg blaster_repeater.ogg enemy_hurt.ogg enemy_destroy.ogg weapon_change.ogg jump_a.ogg land.ogg walking.ogg; do
            curl -L --fail --retry 3 "$BASE/sounds/$FILE" -o "$DEST/$FILE"
          done
          curl -L --fail --retry 3 "$BASE/LICENSE.md" -o "$DEST/LICENSE.md"
          cat > "$DEST/SOURCE.md" <<EOF
          # Source provenance

          Source repository: https://github.com/KenneyNL/Starter-Kit-FPS
          Pinned commit: $COMMIT
          License: code MIT; bundled game assets CC0 per upstream README.
          Runtime use: FPS weapon, hit, movement and weapon-switch feedback.
          EOF

      - name: Commit audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/runtime/audio/kenney-fps
          if ! git diff --cached --quiet; then
            git commit -m "Vendor Kenney FPS CC0 audio"
            git push
          fi
