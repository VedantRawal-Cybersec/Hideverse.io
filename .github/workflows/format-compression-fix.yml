name: Temporary Compression Formatter

on:
  push:
    branches:
      - perf/dedupe-static-compression

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/dedupe-static-compression
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - run: npm install --no-audit --no-fund
      - run: npx prettier --write apps/web/scripts/verify-multiplayer.mjs
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/scripts/verify-multiplayer.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Format compression concurrency QA"
            git push
          fi
