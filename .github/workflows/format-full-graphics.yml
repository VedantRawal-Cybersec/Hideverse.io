name: Temporary Full Graphics Formatter

on:
  push:
    branches:
      - phase/full-graphics-completion

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase/full-graphics-completion
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - run: npm install --no-audit --no-fund
      - run: npx prettier --write apps/game/src/core/audio-feedback.ts apps/game/src/core/character-system.ts apps/game/src/core/weapon-system.ts apps/game/src/styles.css vendor/playcanvas-fps-foundation/SOURCE.md
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/game/src/core/audio-feedback.ts apps/game/src/core/character-system.ts apps/game/src/core/weapon-system.ts apps/game/src/styles.css vendor/playcanvas-fps-foundation/SOURCE.md
          if ! git diff --cached --quiet; then
            git commit -m "Format full graphics completion pass"
            git push
          fi
