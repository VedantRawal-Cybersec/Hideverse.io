name: Final Realism Smoothness QA

on:
  push:
    branches:
      - qa/final-realism-smoothness

permissions:
  contents: read

jobs:
  live-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        map: [ravenwood, nexus, museum, hospital, hotel, axiom]
        profile: [desktop, mobile]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2

      - name: Install Playwright
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify live map realism and smoothness
        env:
          MAP_ID: ${{ matrix.map }}
          PROFILE: ${{ matrix.profile }}
          LIVE_URL: https://hideverse-io.onrender.com
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const mobile = process.env.PROFILE === 'mobile';
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext(
            mobile
              ? {
                  viewport: { width: 390, height: 844 },
                  hasTouch: true,
                  isMobile: true,
                  deviceScaleFactor: 2,
                }
              : { viewport: { width: 1440, height: 900 } },
          );
          const page = await context.newPage();
          const pageErrors = [];
          const consoleErrors = [];
          const failedRequests = [];
          const materialResponses = [];

          page.on('pageerror', (error) => pageErrors.push(String(error)));
          page.on('console', (message) => {
            if (message.type() === 'error') consoleErrors.push(message.text());
          });
          page.on('requestfailed', (request) => {
            failedRequests.push({
              url: request.url(),
              error: request.failure()?.errorText ?? 'unknown',
            });
          });
          page.on('response', (response) => {
            if (response.url().includes('/materials/cc0/')) {
              materialResponses.push({
                url: response.url(),
                status: response.status(),
              });
            }
          });

          try {
            const started = Date.now();
            await page.goto(
              `${process.env.LIVE_URL}/game/?map=${process.env.MAP_ID}&room=FINAL-QA`,
              { waitUntil: 'domcontentloaded', timeout: 120000 },
            );
            await page.waitForSelector('#boot-overlay.is-hidden', { timeout: 90000 });
            const bootMs = Date.now() - started;

            // Allow real materials + staggered detail pass to stream in.
            await page.waitForTimeout(mobile ? 6500 : 5200);

            const stats = await page.evaluate(async () => {
              const samples = [];
              let last = performance.now();
              const deadline = last + 4000;

              await new Promise((resolve) => {
                const tick = (now) => {
                  samples.push(now - last);
                  last = now;
                  if (now >= deadline) resolve();
                  else requestAnimationFrame(tick);
                };
                requestAnimationFrame(tick);
              });

              const sorted = [...samples].sort((a, b) => a - b);
              const percentile = (p) =>
                sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * p))] ?? 0;
              const averageMs =
                samples.reduce((sum, value) => sum + value, 0) / Math.max(1, samples.length);

              const textureResources = performance
                .getEntriesByType('resource')
                .map((entry) => entry.name)
                .filter((name) => name.includes('/materials/cc0/'));

              const canvas = document.querySelector('#game-canvas')?.getBoundingClientRect();
              return {
                samples: samples.length,
                averageFps: 1000 / averageMs,
                p95Ms: percentile(0.95),
                p99Ms: percentile(0.99),
                veryLongFrames: samples.filter((value) => value > 100).length,
                fpsHud: document.querySelector('#fps-value')?.textContent ?? '',
                quality: document.querySelector('#quality-select')?.value ?? '',
                status: document.querySelector('#map-status')?.textContent ?? '',
                textureResources: [...new Set(textureResources)],
                canvas: canvas ? { width: canvas.width, height: canvas.height } : null,
              };
            });

            const badMaterialResponses = materialResponses.filter((entry) => entry.status >= 400);
            const summary = {
              map: process.env.MAP_ID,
              profile: process.env.PROFILE,
              bootMs,
              stats,
              materialResponses: [...new Map(materialResponses.map((x) => [x.url, x])).values()],
              pageErrors,
              consoleErrors,
              failedRequests,
              badMaterialResponses,
            };
            console.log('[final-realism-qa]', JSON.stringify(summary));

            if (!stats.canvas || stats.canvas.width < 300 || stats.canvas.height < 300) {
              throw new Error('Canvas did not render at a playable size');
            }
            if (pageErrors.length || consoleErrors.length || failedRequests.length) {
              throw new Error('Browser/runtime/network errors detected');
            }
            if (badMaterialResponses.length) {
              throw new Error('One or more real material textures returned HTTP errors');
            }
            if (stats.textureResources.length < 4) {
              throw new Error(
                `Too few real surface textures loaded: ${stats.textureResources.length}`,
              );
            }
            if (stats.averageFps < 18) {
              throw new Error(`Frame pacing collapsed: ${stats.averageFps.toFixed(1)} FPS`);
            }
          } finally {
            await context.close();
            await browser.close();
          }
          NODE
