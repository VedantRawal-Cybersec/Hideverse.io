name: Temporary Character Formatter

on:
  push:
    branches:
      - phase/character-model-completion

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase/character-model-completion
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - run: npm install --no-audit --no-fund
      - run: npx prettier --write apps/game/src/core/character-system.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/game/src/core/character-system.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format character graphics completion"
            git push
          fi
